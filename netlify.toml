[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

# The API functions (netlify/functions/*.js) are exposed directly at
# /api/... via each function's `config.path`. Netlify routes requests to a
# deployed function BEFORE applying redirect rules, so the SPA catch-all
# below never shadows them. (An old /api/* → /.netlify/functions/:splat
# rewrite was removed because it pointed at function names that don't exist
# — the API is served from data.js at /api/... — and broke every API call.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────
# This is a private finance app: no framing, no sniffing, no search indexing,
# and a Content-Security-Policy that only allows its own scripts plus Google
# Fonts. (Netlify adds HSTS automatically on HTTPS.)
# If you add a third-party script, analytics, or image host, extend the CSP.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    X-Robots-Tag = "noindex, nofollow"

# Built asset filenames contain a content hash, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
